<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>vuln() 函数的栈帧布局</title>
  <desc>高地址在上、低地址在下，依次为调用者栈帧、返回地址、保存的 rbp、buf[16]。buf 溢出时从低地址向高地址写入，先淹没保存的 rbp，再覆盖返回地址。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="380" rx="12" fill="#FCFCFB" stroke="#E3E2DE" stroke-width="1"/>

  <text x="40" y="46" font-size="14" font-weight="500" fill="#2C2C2A">vuln() 栈帧布局（gcc -O0，未开启 Canary）</text>

  <line x1="130" y1="95" x2="130" y2="307" stroke="#B4B2A9" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="88" y="95" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">高地址</text>
  <text x="88" y="307" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">低地址</text>

  <rect x="190" y="95" width="260" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="205" y="115" font-size="13" fill="#5F5E5A" dominant-baseline="central">调用者的栈帧</text>
  <text x="435" y="115" font-size="12" fill="#888780" text-anchor="end" dominant-baseline="central">…</text>

  <rect x="190" y="135" width="260" height="56" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="205" y="154" font-size="13" font-weight="500" fill="#501313" dominant-baseline="central">返回地址 (ret)</text>
  <text x="435" y="154" font-size="12" fill="#A32D2D" text-anchor="end" dominant-baseline="central" font-family="ui-monospace, Consolas, monospace">rbp + 0x8</text>
  <text x="205" y="175" font-size="12" fill="#A32D2D" dominant-baseline="central">← 溢出目标：控制它 = 控制 RIP</text>

  <rect x="190" y="191" width="260" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="205" y="213" font-size="13" fill="#5F5E5A" dominant-baseline="central">保存的 rbp</text>
  <text x="435" y="213" font-size="12" fill="#888780" text-anchor="end" dominant-baseline="central" font-family="ui-monospace, Consolas, monospace">rbp</text>

  <rect x="190" y="235" width="260" height="72" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="205" y="259" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">buf[16]</text>
  <text x="435" y="259" font-size="12" fill="#185FA5" text-anchor="end" dominant-baseline="central" font-family="ui-monospace, Consolas, monospace">rbp - 0x10</text>
  <text x="205" y="281" font-size="12" fill="#185FA5" dominant-baseline="central">局部数组：写入超过 16 字节即溢出</text>

  <line x1="480" y1="300" x2="480" y2="162" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="496" y="224" font-size="13" font-weight="500" fill="#A32D2D" dominant-baseline="central">溢出方向</text>
  <text x="496" y="244" font-size="12" fill="#A32D2D" dominant-baseline="central">写入 &gt; 16 字节</text>

  <text x="190" y="345" font-size="13" fill="#5F5E5A">buf 起始 → 返回地址的偏移 = 16（buf）+ 8（保存的 rbp）= 24 字节</text>
</svg>
