<svg viewBox="0 0 680 220" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>CPU 指令执行循环</title>
  <desc>取指、译码、执行、写回四步循环，执行完自动取下一条指令。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="220" rx="12" fill="#FCFCFB" stroke="#E3E2DE" stroke-width="1"/>

  <text x="40" y="46" font-size="14" font-weight="500" fill="#2C2C2A">CPU 指令执行循环</text>

  <rect x="41" y="80" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="106" y="98" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">取指</text>
  <text x="106" y="118" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">读 RIP 处指令</text>

  <rect x="197" y="80" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="262" y="98" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">译码</text>
  <text x="262" y="118" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">解析要做什么</text>

  <rect x="353" y="80" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="418" y="98" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">执行</text>
  <text x="418" y="118" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">ALU 运算或访存</text>

  <rect x="509" y="80" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="574" y="98" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">写回</text>
  <text x="574" y="118" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">结果写进寄存器</text>

  <line x1="175" y1="108" x2="193" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="331" y1="108" x2="349" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="487" y1="108" x2="505" y2="108" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>

  <path d="M574 136 V175 H106 V140" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="340" y="192" font-size="12" fill="#5F5E5A" text-anchor="middle">下一条指令（RIP 已自动前进）</text>
</svg>
