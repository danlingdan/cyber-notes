<svg viewBox="0 0 720 372" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>函数调用的栈变化</title>
  <desc>call 到 ret 四个阶段：call 压入返回地址；push rbp 保存调用者帧指针；sub rsp 开辟局部变量区；leave ret 回收栈帧并跳回调用者。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="372" rx="12" fill="#FCFCFB" stroke="#E3E2DE" stroke-width="1"/>

  <text x="40" y="44" font-size="14" font-weight="500" fill="#2C2C2A">一次函数调用的栈变化（高地址在上，栈向低地址生长）</text>

  <line x1="52" y1="80" x2="52" y2="248" stroke="#B4B2A9" stroke-width="1.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="44" y="84" font-size="12" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">高地址</text>
  <text x="44" y="248" font-size="12" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">低地址</text>

  <!-- 第 1 列：call 之后 -->
  <rect x="80" y="80" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="88" y="102" font-size="12" fill="#5F5E5A" dominant-baseline="central">调用者栈帧</text>
  <rect x="80" y="124" width="104" height="32" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="88" y="140" font-size="12" font-weight="500" fill="#501313" dominant-baseline="central">返回地址</text>
  <line x1="198" y1="140" x2="188" y2="140" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="202" y="140" font-size="12" font-weight="500" fill="#2C2C2A" font-family="ui-monospace, Consolas, monospace" dominant-baseline="central">rsp</text>
  <text x="132" y="272" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">① call add</text>
  <text x="132" y="290" font-size="12" fill="#5F5E5A" text-anchor="middle">返回地址入栈</text>

  <!-- 第 2 列：push rbp -->
  <rect x="240" y="80" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="248" y="102" font-size="12" fill="#5F5E5A" dominant-baseline="central">调用者栈帧</text>
  <rect x="240" y="124" width="104" height="32" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="248" y="140" font-size="12" font-weight="500" fill="#501313" dominant-baseline="central">返回地址</text>
  <rect x="240" y="156" width="104" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="248" y="172" font-size="12" fill="#5F5E5A" dominant-baseline="central">保存的 rbp</text>
  <line x1="358" y1="172" x2="348" y2="172" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="362" y="172" font-size="12" font-weight="500" fill="#2C2C2A" font-family="ui-monospace, Consolas, monospace" dominant-baseline="central">rsp rbp</text>
  <text x="292" y="272" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">② push rbp</text>
  <text x="292" y="290" font-size="12" fill="#5F5E5A" text-anchor="middle">保存调用者的 rbp</text>

  <!-- 第 3 列：sub rsp -->
  <rect x="400" y="80" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="408" y="102" font-size="12" fill="#5F5E5A" dominant-baseline="central">调用者栈帧</text>
  <rect x="400" y="124" width="104" height="32" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="408" y="140" font-size="12" font-weight="500" fill="#501313" dominant-baseline="central">返回地址</text>
  <text x="512" y="140" font-size="11" fill="#A32D2D" font-family="ui-monospace, Consolas, monospace" dominant-baseline="central">rbp+0x8</text>
  <rect x="400" y="156" width="104" height="32" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="408" y="172" font-size="12" fill="#5F5E5A" dominant-baseline="central">保存的 rbp</text>
  <text x="512" y="172" font-size="11" fill="#888780" font-family="ui-monospace, Consolas, monospace" dominant-baseline="central">rbp</text>
  <rect x="400" y="188" width="104" height="60" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="408" y="212" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">局部变量区</text>
  <text x="408" y="230" font-size="11" fill="#185FA5" dominant-baseline="central">栈参数也从这借（如数组）</text>
  <line x1="518" y1="218" x2="508" y2="218" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="522" y="218" font-size="12" font-weight="500" fill="#2C2C2A" font-family="ui-monospace, Consolas, monospace" dominant-baseline="central">rsp</text>
  <text x="452" y="272" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">③ sub rsp, 0x10</text>
  <text x="452" y="290" font-size="12" fill="#5F5E5A" text-anchor="middle">开辟局部变量空间</text>

  <!-- 第 4 列：leave ret -->
  <rect x="560" y="80" width="104" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="568" y="102" font-size="12" fill="#5F5E5A" dominant-baseline="central">调用者栈帧</text>
  <rect x="560" y="124" width="104" height="32" rx="6" fill="#FCFCFB" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="568" y="140" font-size="12" fill="#A32D2D" dominant-baseline="central">返回地址（已弹出）</text>
  <text x="612" y="210" font-size="12" font-weight="500" fill="#A32D2D" text-anchor="middle">弹出 → 写入 RIP</text>
  <text x="612" y="228" font-size="12" fill="#A32D2D" text-anchor="middle">CPU 从那里继续执行</text>
  <text x="612" y="272" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">④ leave; ret</text>
  <text x="612" y="290" font-size="12" fill="#5F5E5A" text-anchor="middle">栈帧回收，回到调用者</text>

  <text x="80" y="326" font-size="12" fill="#5F5E5A">leave = mov rsp, rbp + pop rbp；ret = pop rip + 跳转。压了什么弹什么，原路收回。</text>
  <text x="80" y="348" font-size="12" font-weight="500" fill="#A32D2D">ret 弹到哪，RIP 就到哪 —— 所有控制流劫持（ret2win / ROP）抢的都是这一下。</text>
</svg>
