<svg viewBox="0 0 720 392" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>ELF 的两个视角</title>
  <desc>左边是文件视角的节（readelf -S），右边是进程视角的段（readelf -l）；装载时若干节按权限合并进 LOAD 段，.bss 不占文件空间。</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="392" rx="12" fill="#FCFCFB" stroke="#E3E2DE" stroke-width="1"/>

  <text x="40" y="44" font-size="14" font-weight="500" fill="#2C2C2A">同一个 ELF，两个视角：文件里叫节，内存里叫段</text>

  <text x="60" y="74" font-size="13" font-weight="500" fill="#2C2C2A">文件（readelf -S）</text>
  <text x="468" y="74" font-size="13" font-weight="500" fill="#2C2C2A">进程地址空间（readelf -l）</text>

  <!-- 左：文件 -->
  <rect x="60" y="88" width="200" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="72" y="102" font-size="12" fill="#5F5E5A" dominant-baseline="central">ELF 头（64 B）</text>
  <rect x="60" y="116" width="200" height="28" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="72" y="130" font-size="12" fill="#5F5E5A" dominant-baseline="central">程序头表</text>
  <rect x="60" y="144" width="200" height="46" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="72" y="162" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">.init .plt .text .fini</text>
  <text x="72" y="179" font-size="11" fill="#185FA5" dominant-baseline="central">代码</text>
  <rect x="60" y="190" width="200" height="36" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="72" y="208" font-size="12" fill="#5F5E5A" dominant-baseline="central">.rodata .eh_frame（只读数据）</text>
  <rect x="60" y="226" width="200" height="46" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="72" y="244" font-size="12" font-weight="500" fill="#501313" dominant-baseline="central">.got .got.plt .data .dynamic</text>
  <text x="72" y="261" font-size="11" fill="#A32D2D" dominant-baseline="central">读写数据（GOT 是 PWN 重点）</text>
  <rect x="60" y="272" width="200" height="28" rx="6" fill="#FCFCFB" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="72" y="286" font-size="12" fill="#888780" dominant-baseline="central">.bss（不占文件空间）</text>
  <rect x="60" y="300" width="200" height="36" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="72" y="313" font-size="12" fill="#5F5E5A" dominant-baseline="central">节区表 + .symtab / .strtab</text>
  <text x="72" y="329" font-size="11" fill="#888780" dominant-baseline="central">运行时用不到，strip 删的就是它们</text>
  <text x="60" y="356" font-size="11" fill="#888780">文件偏移 0 → 文件末尾</text>

  <!-- 右：内存 -->
  <rect x="468" y="144" width="200" height="46" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="480" y="162" font-size="12" font-weight="500" fill="#042C53" dominant-baseline="central">LOAD：r-x</text>
  <text x="480" y="179" font-size="11" fill="#185FA5" dominant-baseline="central">代码页，NX 只关这里执行</text>
  <rect x="468" y="190" width="200" height="36" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="480" y="208" font-size="12" fill="#5F5E5A" dominant-baseline="central">LOAD：r--（只读数据）</text>
  <rect x="468" y="226" width="200" height="46" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text x="480" y="244" font-size="12" font-weight="500" fill="#501313" dominant-baseline="central">LOAD：rw-（读写数据）</text>
  <text x="480" y="261" font-size="11" fill="#A32D2D" dominant-baseline="central">partial RELRO 时 GOT 仍可写</text>
  <rect x="468" y="272" width="200" height="28" rx="6" fill="#FCFCFB" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="480" y="286" font-size="12" fill="#888780" dominant-baseline="central">映射时补零占位</text>
  <text x="468" y="324" font-size="11" fill="#888780">此后是 heap、libc 映射、stack</text>
  <text x="468" y="356" font-size="11" fill="#888780">虚拟地址 0x400000 起（-no-pie 实测）</text>

  <!-- 映射箭头 -->
  <line x1="268" y1="167" x2="460" y2="167" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="268" y1="208" x2="460" y2="208" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="268" y1="249" x2="460" y2="249" stroke="#888780" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="268" y1="286" x2="460" y2="286" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>

  <text x="40" y="380" font-size="12" fill="#5F5E5A">节是内容分类（给链接器、调试器看）；段是权限划分（给内核 mmap 用），一个段由若干节拼成。</text>
</svg>
