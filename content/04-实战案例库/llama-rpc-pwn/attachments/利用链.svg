<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="164" viewBox="0 0 1272 164" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4B2A9"/>
    </marker>
  </defs>

  <rect width="1272" height="164" fill="#FCFCFB"/>

  <!-- 阶段标注 -->
  <text x="422" y="30" font-size="14" fill="#B4B2A9" text-anchor="middle">① 泄漏</text>
  <text x="956" y="30" font-size="14" fill="#B4B2A9" text-anchor="middle">② 劫持</text>
  <text x="1170" y="30" font-size="14" fill="#B4B2A9" text-anchor="middle">③ 触发</text>

  <!-- 泄漏段：蓝块 ×4 -->
  <rect x="8" y="52" width="185" height="92" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="100" y="92" font-size="15" font-weight="bold" fill="#378ADD" text-anchor="middle">ALLOC_BUFFER 堆泄漏</text>
  <text x="100" y="118" font-size="13" fill="#555555" text-anchor="middle">句柄就是结构体地址</text>

  <rect x="222" y="52" width="185" height="92" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="314" y="92" font-size="15" font-weight="bold" fill="#378ADD" text-anchor="middle">GET_TENSOR 任意读</text>
  <text x="314" y="118" font-size="13" fill="#555555" text-anchor="middle">dump 出 buffer 结构体</text>

  <rect x="436" y="52" width="185" height="92" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="528" y="92" font-size="15" font-weight="bold" fill="#378ADD" text-anchor="middle">推 libggml 基址</text>
  <text x="528" y="118" font-size="13" fill="#555555" text-anchor="middle">iface 表三重自检</text>

  <rect x="650" y="52" width="185" height="92" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="742" y="92" font-size="15" font-weight="bold" fill="#378ADD" text-anchor="middle">读 free@GOT</text>
  <text x="742" y="118" font-size="13" fill="#555555" text-anchor="middle">得 libc 基址</text>

  <!-- 劫持段 / 触发段：红块 ×2 -->
  <rect x="864" y="52" width="185" height="92" rx="8" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="956" y="82" font-size="15" font-weight="bold" fill="#E24B4A" text-anchor="middle">EDIT_BUFFER 任意写</text>
  <text x="956" y="104" font-size="13" fill="#555555" text-anchor="middle">context ← 命令串</text>
  <text x="956" y="126" font-size="13" fill="#555555" text-anchor="middle">__free_hook ← system</text>

  <rect x="1078" y="52" width="185" height="92" rx="8" fill="#FCEBEB" stroke="#E24B4A"/>
  <text x="1170" y="82" font-size="15" font-weight="bold" fill="#E24B4A" text-anchor="middle">FREE_BUFFER 触发</text>
  <text x="1170" y="104" font-size="13" fill="#555555" text-anchor="middle">free(context) → system</text>
  <text x="1170" y="126" font-size="13" fill="#555555" text-anchor="middle">→ getshell</text>

  <!-- 箭头 -->
  <line x1="196" y1="98" x2="216" y2="98" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="410" y1="98" x2="430" y2="98" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="624" y1="98" x2="644" y2="98" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="838" y1="98" x2="858" y2="98" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="1052" y1="98" x2="1072" y2="98" stroke="#B4B2A9" stroke-width="1.5" marker-end="url(#ar)"/>
</svg>
