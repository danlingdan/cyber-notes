<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="560" height="566" viewBox="0 0 560 566" version="1.1">
  <style>
    text { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #55534b; }
    .plugin { font-size: 14px; font-weight: 600; fill: #2b6ea8; }
    .desc   { font-size: 11.5px; fill: #55534b; }
    .sign   { font-size: 11.5px; fill: #d23f3f; }
    .signtitle { font-size: 11.5px; font-weight: 600; fill: #d23f3f; }
    .box    { fill: #e6f1fb; stroke: #378add; stroke-width: 1.2; }
    .greybox{ fill: #f1efe8; stroke: #b4b2a9; stroke-width: 1.2; }
    .arrow  { stroke: #b4b2a9; stroke-width: 1.4; fill: none; }
    .arrowhead { fill: #b4b2a9; }
  </style>

  <rect x="0" y="0" width="560" height="566" fill="#fcfcfb"/>

  <!-- 六个阶段 -->
  <g>
    <rect class="box" x="24" y="18" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="41">windows.info</text>
    <text class="desc"  x="40" y="61">认系统：版本、内核构建、抓取时间</text>
    <text class="signtitle" x="344" y="34">看点</text>
    <text class="sign" x="344" y="52">系统版本决定后面插件的适用范围</text>
    <text class="sign" x="344" y="68">抓取时间用于对时间线</text>
  </g>

  <path class="arrow" d="M 174 74 L 174 98"/>
  <polygon class="arrowhead" points="174,102 169,94 179,94"/>

  <g>
    <rect class="box" x="24" y="106" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="129">windows.pslist / pstree / psscan</text>
    <text class="desc"  x="40" y="149">进程三视图：活动名单、父子树、池扫描</text>
    <text class="signtitle" x="344" y="122">可疑信号</text>
    <text class="sign" x="344" y="140">父进程不对（如 explorer 生成 svchost）</text>
    <text class="sign" x="344" y="156">三视图数量对不上（隐藏进程）</text>
  </g>

  <path class="arrow" d="M 174 162 L 174 186"/>
  <polygon class="arrowhead" points="174,190 169,182 179,182"/>

  <g>
    <rect class="box" x="24" y="194" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="217">windows.cmdline</text>
    <text class="desc"  x="40" y="237">逐进程核对命令行与 exe 路径</text>
    <text class="signtitle" x="344" y="210">可疑信号</text>
    <text class="sign" x="344" y="228">系统进程名却不在系统目录</text>
    <text class="sign" x="344" y="244">命令行带临时目录、下载地址</text>
  </g>

  <path class="arrow" d="M 174 250 L 174 274"/>
  <polygon class="arrowhead" points="174,278 169,270 179,270"/>

  <g>
    <rect class="box" x="24" y="282" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="305">windows.netscan</text>
    <text class="desc"  x="40" y="325">连接与套接字：地址、端口、归属进程</text>
    <text class="signtitle" x="344" y="298">可疑信号</text>
    <text class="sign" x="344" y="316">陌生外联 IP 与非常见端口</text>
    <text class="sign" x="344" y="332">无窗口进程持有对外连接</text>
  </g>

  <path class="arrow" d="M 174 338 L 174 362"/>
  <polygon class="arrowhead" points="174,366 169,358 179,358"/>

  <g>
    <rect class="box" x="24" y="370" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="393">windows.hivelist → printkey</text>
    <text class="desc"  x="40" y="413">Run 启动项、服务 ImagePath 找持久化</text>
    <text class="signtitle" x="344" y="386">可疑信号</text>
    <text class="sign" x="344" y="404">Run 项指向用户临时目录</text>
    <text class="sign" x="344" y="420">键值里的 exe 路径在系统目录之外</text>
  </g>

  <path class="arrow" d="M 174 426 L 174 450"/>
  <polygon class="arrowhead" points="174,454 169,446 179,446"/>

  <g>
    <rect class="greybox" x="24" y="458" width="300" height="56" rx="6"/>
    <text class="plugin" x="40" y="481" style="fill: #6d6a60">汇总：可疑进程侧写</text>
    <text class="desc"  x="40" y="501">进程 + 持久化 + 外联 → 交给 M13 深挖</text>
    <text class="signtitle" x="344" y="474">下一步</text>
    <text class="sign" x="344" y="492" style="fill: #55534b">malfind 定位注入、dumpfiles 提取</text>
    <text class="sign" x="344" y="508" style="fill: #55534b">timeliner 串时间线（M13）</text>
  </g>

  <text class="desc" x="24" y="548" style="fill: #8a8779">每一步都有确定输出；没有异常信号就进入下一步，任何一步命中都回填进侧写。</text>
</svg>
