  <circle class="dotg" cx="505" cy="312" r="5"/>
  <text class="ev" x="394" y="340">DNS cv-update.example.com = 41.168.5.140 02:44:14</text>
  <circle class="dotg" cx="510" cy="312" r="5"/>
  <text class="ev" x="518" y="308">GET /zb/v_01_a/in/cp.php 02:44:16</text>
  <circle class="dotg" cx="656" cy="312" r="5"/>
  <text class="ev" x="540" y="340">POST /zb/v_01_a/in/up.php 02:45:20</text>
  <text class="ev" x="40" y="340">（噪声：www.example.com 02:44:00）</text>

  <!-- 时间轴 -->
  <line class="axis" x1="55" y1="380" x2="770" y2="380"/>
  <polygon points="778,380 770,376 770,384" fill="#b4b2a9"/>
  <!-- 压缩区间记号 -->
  <line class="axis" x1="150" y1="372" x2="200" y2="388"/>
  <text class="tick" x="152" y="404">02:32 - 02:42（静默，压缩）</text>
  <g font-size="10.5" fill="#8a8779">
    <text x="94" y="368">02:31:50</text>
    <text x="99" y="396">02:31:51</text>
    <text x="248" y="368">02:42:31</text>
    <text x="454" y="368">02:44:01</text>
    <text x="483" y="396">02:44:14</text>
    <text x="634" y="368">02:45:20</text>
    <text x="722" y="396">02:46:00</text>
  </g>

  <text class="ev" x="20" y="446" style="fill:#8a8779">分段刻度：感染时刻与回连窗口各自展开，中间两分钟静默压缩；三条泳道的竖直虚线是三处跨源互证。</text>
</svg>
